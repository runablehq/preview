name: diagnose-macos-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g @runablehq/preview@0.1.0
      - name: Inspect Python DNS and socket startup
        shell: bash
        run: |
          set -uo pipefail
          set +e
          export PREVIEW_HOME="$(mktemp -d)"
          export PREVIEW_HOST=127.0.0.1
          work=$(mktemp -d)
          cd "$work"
          cleanup() {
            for name in default ipv4 loopback; do preview stop "$name" || true; done
            rm -rf "$PREVIEW_HOME" "$work"
          }
          trap cleanup EXIT
          sw_vers
          python3 --version
          command -v python3
          hostname
          cat /etc/hosts
          preview --version
          python3 -u - <<'PY'
          import subprocess, sys
          for address in ['', '0.0.0.0', '::', '127.0.0.1']:
              code = ('import socket,time; start=time.monotonic(); '
                      f'print(socket.getfqdn({address!r}),time.monotonic()-start,flush=True)')
              child = subprocess.Popen([sys.executable, '-u', '-c', code], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              try:
                  out, _ = child.communicate(timeout=8)
                  print('getfqdn', repr(address), 'exit', child.returncode, out.strip(), flush=True)
              except subprocess.TimeoutExpired:
                  child.kill()
                  out, _ = child.communicate()
                  print('getfqdn', repr(address), 'TIMED OUT', out.strip(), flush=True)
          PY
          python3 -u -c 'import faulthandler,runpy,sys; faulthandler.dump_traceback_later(3); sys.argv=["http.server","8769"]; runpy.run_module("http.server",run_name="__main__")' > "$work/python-stack.log" 2>&1 &
          server_pid=$!
          sleep 4
          kill "$server_pid" || true
          wait "$server_pid" || true
          cat "$work/python-stack.log"
          for spec in default:8765 ipv4:8766 loopback:8767; do
            name=${spec%:*}
            port=${spec#*:}
            set -- python3 -m http.server "$port"
            case "$name" in
              ipv4) set -- "$@" --bind 0.0.0.0 ;;
              loopback) set -- "$@" --bind 127.0.0.1 ;;
            esac
            echo "Probe $name on $port"
            preview run --name "$name" --wait 5 -- "$@"
            echo "preview exit: $?"
            preview list
            preview logs "$name" || true
            /usr/sbin/lsof -nP -iTCP:"$port" || true
            /usr/sbin/netstat -anv -p tcp | awk -v p=".$port" 'index($4,p) || index($5,p)'
            curl -sS --max-time 2 -o /dev/null -w 'HTTP %{http_code}\n' "http://127.0.0.1:$port/" || true
            preview stop "$name" || true
          done
