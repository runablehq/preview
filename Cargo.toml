[package]
name = "preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Run any web app on a free port, restart it cleanly, and report where it listens."
repository = "https://github.com/runablehq/preview"
publish = false

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
libc = "0.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
